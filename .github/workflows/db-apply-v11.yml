name: DB Apply v1.1 (0013 to 0016)

# v1.1 の DB 変更 4本をライブ DB(moffy-prod)へ**1トランザクションで**適用する。
#
#   0013 … app_under のキー欠落を未達に倒す / daily_tiktok_under_20 を停止・掃除
#   0014 … fn_profile_stats（メニュー統計のサーバー集計 RPC）
#   0015 … クエスト達成条件の fail-closed 化（reduce_total / streak_keep /
#           hatch_count / app_under）+ eggs.hatched_at の新設
#   0016 … 成長充当の冪等キーに発生源を含める（消えていた削減ptを卵に届ける）
#
# ⚠️ なぜ1トランザクションか:
#   4本には依存関係がある（0015 は 0013 の quest_condition_met を全文置換し、
#   0016 は 0012 の fn_finalize_day を土台にする）。途中で失敗して中途半端な状態が
#   残ると、どこまで適用されたかを人間が判定するのが難しい。psql に -f を並べて
#   --single-transaction を付けると、1本でも失敗した時点で**全部ロールバック**される。
#
# ⚠️ アプリとの適用順:
#   **DB を先に適用してからアプリを配信する。**
#   4本とも新しい関数シグネチャをクライアントに要求しないため、現在公開中の
#   1.0.2 を壊さない（0016 の fn_apply_growth は引数にデフォルトがあり、
#   既存の3引数呼び出しはそのまま通る）。逆にアプリを先に出すと、fn_profile_stats が
#   無い状態で v1.1 アプリが動くことになる（v1.1 は統計欠落として縮退表示するので
#   軽傷だが、順序を守れば起きない）。
#
# 冪等: 4本とも再実行安全（create or replace / add column if not exists /
#       drop if exists / where 句つきの UPDATE・DELETE）。
# 接続は Secret SUPABASE_DB_URL。前提: 0001〜0012 は適用済み。手動実行のみ。
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secret present
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret が未設定です。"
            exit 1
          fi
          psql --version

      # --- 前提の確認: 0011/0012 が入っていること -------------------------------
      # 0016 は 0012 版の fn_finalize_day を土台にしている。0012 未適用の DB に当てると
      # 「基準値を確定済み日だけに絞る」修正が巻き戻る（＝注入行が基準値に効く状態に戻る）。
      - name: Gate (前提マイグレーションの確認)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if to_regprocedure('public.fn_submit_and_finalize_day(date,integer,jsonb,text)') is null then
              raise exception '適用中止: 0011 が未適用（fn_submit_and_finalize_day が無い）。先に db-apply-0011 を実行すること。';
            end if;
            -- coalesce が要る: 関数が存在しないと副問い合わせが NULL になり、
            -- `NULL not like ...` は NULL ＝ plpgsql の IF では偽扱いになって
            -- 「0012 未適用」を**素通り**させてしまう。
            if coalesce((select prosrc from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                          where n.nspname='public' and p.proname='fn_finalize_day'), '')
               not like '%and is_finalized = true%' then
              raise exception '適用中止: 0012 が未適用、または fn_finalize_day が存在しない（基準値クエリに is_finalized=true が無い）。';
            end if;
            raise notice '=== 前提ゲート PASS（0011/0012 適用済み）===';
          end $$;
          SQL

      # --- 適用前の可視化: 何が消え、何が farm されていたかを記録に残す -----------
      - name: Inspect before apply (可視化のみ・失敗させない)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "### 停止対象クエストの現状（reward_granted=true があれば不正取得の実績）"
          psql "$DB_URL" -c "select quest_id, is_completed, reward_granted, count(*) from public.user_quests where quest_id='daily_tiktok_under_20' group by 1,2,3 order by 1,2,3;" || true
          echo "### 0015 の影響見積: 計測ゼロで確定した日（iOS の reduce_total 50pt が出ていた日）"
          psql "$DB_URL" -c "select source_mode, count(*) from public.usage_daily where is_finalized and total_minutes = 0 group by 1 order by 1;" || true
          echo "### 適用前の孵化済み卵（0015 は updated_at を孵化日時に採用しない。記録用）"
          psql "$DB_URL" -c "select count(*) filter (where location='hatched') as hatched_total, count(*) filter (where location='hatched' and updated_at > now() - interval '7 days') as touched_last_7d from public.eggs;" || true
          echo "### 0016 の影響見積: 同一日に確定とwarmupの両方があった回数（= ptが消えた日）"
          psql "$DB_URL" -c "select count(*) from (select user_id, ledger_date from public.point_ledger where amount > 0 and source in ('reduction','warmup') group by 1,2 having count(distinct source) > 1) t;" || true

      # 残高は「1ptも動かさない」ことが 0016 の約束。適用の前後で全行を突き合わせる。
      # ⚠️ 不可逆な変更（0013 の user_quests DELETE / 0015 の eggs バックフィル）の前に
      #    必ず適用前スナップショットを取る。保存先は2箇所に分かれる:
      #      * runner の /tmp … 下の Snapshot BEFORE ステップ（job 終了で消える。行数確認用）
      #      * DB 内の ops スキーマ … 下の Apply ステップの -c（残る。事後調査の本体）
      #    ★ops のスナップショットは**調査が終わったら必ず drop すること**（ORG_STATE 手順3-5）。
      #      退会ユーザーの物理削除（fn_purge_deleted_accounts / 30日）は ops に届かない。
      #      CTAS で作った素のテーブルで auth.users への FK が無く、cascade が及ばないため。
      #    --single-transaction が守るのは「途中で失敗した」ケースだけで、
      #    「成功したが内容が間違っていた」は守らない。そのとき比較対象が無いと調査できない。
      # ⚠️⚠️ **このリポジトリは PUBLIC**（無料でActionsを回すため公開にしてある）。
      #    よってワークフローログは**誰でも閲覧できる**（artifact 保存を入れかけたが削除済み）。
      #    本番ユーザーの UUID・残高をここへ出してはいけない（1回出したら取り消せない）。
      #    スナップショットは runner のローカル(/tmp)に置き、**行数だけ**をログに出す。
      #    適用後の調査に使う本体は、下の Apply ステップで **DB の中**(ops スキーマ)に取る。
      - name: Snapshot BEFORE (runner ローカルのみ / 公開しない)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DB_URL" -At -F '|' \
            -c "select id, point_balance, pooled_points, gem_balance from public.profiles order by id;" \
            > /tmp/balances_before.txt
          psql "$DB_URL" -At -F '|' \
            -c "select id, user_id, quest_id, kind, period_start, is_completed, reward_granted, completed_at from public.user_quests where quest_id='daily_tiktok_under_20' order by id;" \
            > /tmp/user_quests_tiktok_before.txt
          psql "$DB_URL" -At -F '|' \
            -c "select id, user_id, location, created_at, updated_at, hatched_into from public.eggs where location='hatched' order by id;" \
            > /tmp/eggs_hatched_before.txt
          echo "### 取得できた行数だけを出す（ID・残高は公開ログに出さない）"
          wc -l /tmp/balances_before.txt /tmp/user_quests_tiktok_before.txt /tmp/eggs_hatched_before.txt

      # --- 本体: 4本を1トランザクションで適用 ------------------------------------
      # lock_timeout: 0015 の add column が eggs に ACCESS EXCLUSIVE を取り、
      #   --single-transaction なのでコミットまで保持する。lock_timeout が制限するのは
      #   **ロック取得の待ち時間だけ**（取得後の保持時間は statement_timeout 側）。
      #   長時間待たされて本番の卵まわりを巻き込むのを避け、5秒で諦めて全体をロールバックする。
      - name: Apply 0013 to 0016 (single transaction)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 --single-transaction \
            -c "set lock_timeout = '5s'; set statement_timeout = '180s';" \
            -c "create schema if not exists ops; \
                revoke all on schema ops from public, anon, authenticated; \
                create table if not exists ops.snap_v11_balances as \
                  select id, point_balance, pooled_points, gem_balance from public.profiles; \
                create table if not exists ops.snap_v11_eggs_hatched as \
                  select id, user_id, location, created_at, updated_at, hatched_into \
                    from public.eggs where location='hatched'; \
                create table if not exists ops.snap_v11_user_quests_tiktok as \
                  select * from public.user_quests where quest_id='daily_tiktok_under_20'; \
                revoke all on all tables in schema ops from public, anon, authenticated;" \
            -f supabase/migrations/0013_disable_tiktok_quest_fail_closed.sql \
            -f supabase/migrations/0014_profile_stats_rpc.sql \
            -f supabase/migrations/0015_quest_condition_hardening.sql \
            -f supabase/migrations/0016_ledger_source_key.sql

      # --- 残高の前後比較（異常判定ではなく、人間が見る材料） --------------------
      # ⚠️ ここを exit 1 にしてはいけない。この時点で適用は既に COMMIT 済みなので
      #    落としても何もロールバックされず、「異常」の赤を見た運用者が誤って
      #    巻き戻す判断をするだけになる。しかも両ストア公開中は、適用中に走った
      #    実ユーザーの通常操作（日次確定 / warmup 受取 / クエスト受取 /
      #    新規サインインによる profiles 行追加）だけで差分が出る＝偽陽性が常態。
      - name: Compare balances (warning only)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DB_URL" -At -F '|' \
            -c "select id, point_balance, pooled_points, gem_balance from public.profiles order by id;" \
            > /tmp/balances_after.txt
          if diff -u /tmp/balances_before.txt /tmp/balances_after.txt > /tmp/balances_diff.txt; then
            echo "=== 残高は1ptも動いていない ==="
          else
            echo "::warning::残高に差分がある。0013-0016 は残高列を1つも書かないので、通常は適用中の実ユーザー操作（日次確定 / warmup 受取 / 新規サインイン）による正当な変化。"
            echo "差分の行数（内容は PUBLIC リポジトリのログに出さない）:"
            wc -l < /tmp/balances_diff.txt
            echo "※ 全ユーザー数と同じ行数なら異常。数行〜数十行なら通常トラフィック。"
            echo "※ 中身を見る必要が出たら、Supabase の SQL エディタで ops.snap_v11_balances と突き合わせること。"
          fi

      # ⚠️ 必ず「失敗したら落ちる」形にすること。
      #   単なる select は値を表示するだけで、false でも 0 行でも exit 0 になり、
      #   関数や権限が誤っていてもワークフローが緑になる（0011 の教訓）。
      - name: Verify (関数・列・権限・データの検査)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_fail    int := 0;
            v_granted int;
            v_src     text;
          begin
            -- ============ 0013: クエスト停止 ============
            if exists (select 1 from public.quest_definitions
                        where id = 'daily_tiktok_under_20' and is_active = true) then
              raise warning '[FAIL] daily_tiktok_under_20 が is_active=true のまま';
              v_fail := v_fail + 1;
            end if;
            if not exists (select 1 from public.quest_definitions
                            where id = 'daily_tiktok_under_20') then
              raise warning '[FAIL] daily_tiktok_under_20 の定義行が消えている（停止のはずが削除された）';
              v_fail := v_fail + 1;
            end if;
            if exists (select 1 from public.user_quests
                        where quest_id = 'daily_tiktok_under_20' and reward_granted = false) then
              raise warning '[FAIL] daily_tiktok_under_20 の未受取インスタンスが残っている';
              v_fail := v_fail + 1;
            end if;
            select count(*) into v_granted
              from public.user_quests
             where quest_id = 'daily_tiktok_under_20' and reward_granted = true;
            if v_granted > 0 then
              raise warning '[WARN] daily_tiktok_under_20 で reward_granted=true が % 件ある。付与済み30pt/件の扱い（回収するか）は人間が判断すること。', v_granted;
            end if;

            -- ============ 0014: 統計RPC ============
            if to_regprocedure('public.fn_profile_stats()') is null then
              raise warning '[FAIL] fn_profile_stats が存在しない';
              v_fail := v_fail + 1;
            else
              if not has_function_privilege('authenticated','public.fn_profile_stats()','execute') then
                raise warning '[FAIL] authenticated が fn_profile_stats を実行できない（メニュー統計が死ぬ）';
                v_fail := v_fail + 1;
              end if;
              if has_function_privilege('anon','public.fn_profile_stats()','execute') then
                raise warning '[FAIL] anon が fn_profile_stats を実行できる（未認証に開いている）';
                v_fail := v_fail + 1;
              end if;
              if coalesce((select prosrc from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                            where n.nspname='public' and p.proname='fn_profile_stats'), '')
                 not like '%is_finalized = true%' then
                raise warning '[FAIL] fn_profile_stats が確定日(is_finalized=true)に限定していない';
                v_fail := v_fail + 1;
              end if;
              -- fn_profile_stats は security invoker。参照テーブルの SELECT 権限と
              -- select-own ポリシーが無いと、権限エラーではなく「全部0」を返して
              -- 静かに嘘をつく。関数の存在確認だけでは緑になるのでここまで見る。
              if not (has_table_privilege('authenticated','public.baselines','select')
                  and has_table_privilege('authenticated','public.usage_daily','select')
                  and has_table_privilege('authenticated','public.point_ledger','select')
                  and has_table_privilege('authenticated','public.mofi_collection','select')
                  and has_table_privilege('authenticated','public.streaks','select')) then
                raise warning '[FAIL] authenticated が fn_profile_stats の参照テーブルを select できない';
                v_fail := v_fail + 1;
              end if;
              if (select count(distinct tablename) from pg_policies
                   where schemaname='public' and cmd in ('SELECT','ALL')
                     and tablename in ('baselines','usage_daily','point_ledger','mofi_collection','streaks')) < 5 then
                raise warning '[FAIL] 参照5テーブルの select ポリシーが揃っていない（invoker では0件になる）';
                v_fail := v_fail + 1;
              end if;
            end if;

            -- ============ 0015: 条件の fail-closed 化 ============
            select prosrc into v_src
              from pg_proc p join pg_namespace n on n.oid = p.pronamespace
             where n.nspname = 'public' and p.proname = 'quest_condition_met';
            if v_src is null then
              raise warning '[FAIL] quest_condition_met が存在しない';
              v_fail := v_fail + 1;
            else
              if v_src not like '%jsonb_typeof%' then
                raise warning '[FAIL] app_under が型チェック(jsonb_typeof)をしていない（null値で貫通する）';
                v_fail := v_fail + 1;
              end if;
              if v_src not like '%coalesce(v_streak, 0) > 0%' then
                raise warning '[FAIL] streak_keep が current_streak を見ていない（切った日でも達成になる）';
                v_fail := v_fail + 1;
              end if;
              if v_src not like '%hatched_at%' then
                raise warning '[FAIL] hatch_count が hatched_at を見ていない（no-op UPDATE で farm できる）';
                v_fail := v_fail + 1;
              end if;
              -- reduce_total の計測モード判定（iOS の計測ゼロ日に 50pt が出るのを止めた本体）。
              if v_src not like '%v_today = 0 and v_source_mode%' then
                raise warning '[FAIL] reduce_total が計測モードを見ていない（iOSの計測ゼロ日に50ptが出る）';
                v_fail := v_fail + 1;
              end if;
              if v_src like '%updated_at at time zone%' then
                raise warning '[FAIL] hatch_count に updated_at 基準の判定が残っている';
                v_fail := v_fail + 1;
              end if;
            end if;
            if to_regprocedure('public.quest_condition_met(uuid, jsonb, public.quest_kind, date)') is not null
               and has_function_privilege('authenticated',
                     'public.quest_condition_met(uuid, jsonb, public.quest_kind, date)','execute') then
              raise warning '[FAIL] authenticated が quest_condition_met を直接実行できる';
              v_fail := v_fail + 1;
            end if;

            -- eggs.hatched_at: 存在し、かつ authenticated が**書けない**こと。
            if not exists (select 1 from information_schema.columns
                            where table_schema='public' and table_name='eggs'
                              and column_name='hatched_at') then
              raise warning '[FAIL] eggs.hatched_at 列が無い';
              v_fail := v_fail + 1;
            elsif has_column_privilege('authenticated','public.eggs'::regclass,'hatched_at','UPDATE') then
              raise warning '[FAIL] authenticated が eggs.hatched_at を更新できる（孵化日時を偽装できる＝farm 復活）';
              v_fail := v_fail + 1;
            end if;
            if not exists (select 1 from pg_trigger
                            where tgname = 'trg_eggs_stamp_hatched_at' and not tgisinternal) then
              raise warning '[FAIL] trg_eggs_stamp_hatched_at トリガーが無い（今後の孵化が記録されない）';
              v_fail := v_fail + 1;
            end if;
            -- バックフィル漏れ（過去の孵化が全部 hatch_count から消えると別の嘘になる）。
            if exists (select 1 from public.eggs
                        where location = 'hatched' and hatched_at is null) then
              raise warning '[FAIL] 孵化済みなのに hatched_at が null の卵が残っている（バックフィル漏れ）';
              v_fail := v_fail + 1;
            end if;
            -- ★バックフィルが updated_at を壊していないこと。
            --   set_updated_at（無条件 now()）を一時的に外して実行する設計なので、
            --   全孵化卵の updated_at が「たった今」に揃っていたら外し忘れ＝
            --   farm 調査の唯一の材料が消えたことを意味する（不可逆）。
            -- 時間窓ではなく適用前スナップショットと直接突き合わせる（経過時間・件数に依存しない）。
            -- 少数件のDBで実ユーザーの1操作が誤検知にならないよう、5件以上のときだけ判定する。
            if (select count(*) from ops.snap_v11_eggs_hatched) >= 5
               and not exists (select 1 from public.eggs e
                                 join ops.snap_v11_eggs_hatched s on s.id = e.id
                                where e.updated_at = s.updated_at) then
              raise warning '[FAIL] 全孵化卵の updated_at が適用時刻に揃っている（バックフィルがトリガーを発火させた＝痕跡の破壊）';
              v_fail := v_fail + 1;
            end if;
            -- 適用前スナップショットが実際に取れていること（0行のまま不可逆変更を通さない）。
            if coalesce((select count(*) from ops.snap_v11_balances), 0) = 0 then
              raise warning '[FAIL] ops.snap_v11_balances が空（適用前スナップショットが取れていない）';
              v_fail := v_fail + 1;
            end if;
            -- 0015 のバックフィルが trg_eggs_updated_at を一時停止する。**有効に戻っていること**。
            -- 戻っていないと、以後 eggs の updated_at が一切更新されなくなる。
            -- ★「行が無い」も失敗にする（exists 版だと drop されていた場合に緑になる）。
            if not exists (select 1 from pg_trigger
                            where tgrelid = 'public.eggs'::regclass
                              and tgname = 'trg_eggs_updated_at'
                              and not tgisinternal
                              and tgenabled = 'O') then
              raise warning '[FAIL] trg_eggs_updated_at が無効、または存在しない（バックフィル後に戻し忘れ）';
              v_fail := v_fail + 1;
            end if;
            -- hatched_at が「未来」や「created_at より前」になっていないこと（採用元の妥当性）。
            if exists (select 1 from public.eggs
                        where location = 'hatched'
                          and (hatched_at > now() + interval '1 minute'
                               or hatched_at < created_at - interval '1 minute')) then
              raise warning '[FAIL] hatched_at が created_at より前、または未来になっている卵がある';
              v_fail := v_fail + 1;
            end if;

            -- ============ 0016: 台帳キーの細粒度化 ============
            if to_regprocedure('public.fn_apply_growth(uuid,integer,date,text)') is null then
              raise warning '[FAIL] 4引数版 fn_apply_growth が存在しない';
              v_fail := v_fail + 1;
            end if;
            if to_regprocedure('public.fn_apply_growth(uuid,integer,date)') is not null then
              raise warning '[FAIL] 旧3引数版 fn_apply_growth が残っている（解決が紛らわしい）';
              v_fail := v_fail + 1;
            end if;
            if to_regprocedure('public.fn_apply_growth(uuid,integer,date,text)') is not null
               and has_function_privilege('authenticated','public.fn_apply_growth(uuid,integer,date,text)','execute') then
              raise warning '[FAIL] authenticated が fn_apply_growth を直接実行できる（成長度を任意に加算できる）';
              v_fail := v_fail + 1;
            end if;
            -- 呼び出し側が発生源キーを渡していること。
            if coalesce((select prosrc from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                          where n.nspname='public' and p.proname='fn_finalize_day'), '')
               not like '%fn_apply_growth(null, v_final_points, p_date, v_idem)%' then
              raise warning '[FAIL] fn_finalize_day が発生源キーを渡していない（削減ptが消える問題が残る）';
              v_fail := v_fail + 1;
            end if;
            if coalesce((select prosrc from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                          where n.nspname='public' and p.proname='fn_claim_warmup'), '')
               not like '%fn_apply_growth(v_egg_id, v_grant, v_today, v_idem)%' then
              raise warning '[FAIL] fn_claim_warmup が発生源キーを渡していない';
              v_fail := v_fail + 1;
            end if;
            -- 0012 の剥奪が巻き戻っていないこと（0002 が grant しているので要再掲）。
            if to_regprocedure('public.fn_finalize_day(date)') is not null
               and has_function_privilege('authenticated','public.fn_finalize_day(date)','execute') then
              raise warning '[FAIL] authenticated が本体 fn_finalize_day を直接実行できる（日付境界ガードの迂回が復活）';
              v_fail := v_fail + 1;
            end if;
            -- ★0016 は fn_finalize_day を全文置換する。0012 が入れた「基準値を確定済み日
            --   だけに絞る」ガードが欠落していないかを**適用後にも**確認する
            --   （適用前ゲートだけだと、置換で消えたことを検出できない）。
            if coalesce((select prosrc from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                          where n.nspname='public' and p.proname='fn_finalize_day'), '')
               not like '%and is_finalized = true%' then
              raise warning '[FAIL] fn_finalize_day から 0012 の is_finalized=true が消えた（基準値の注入脆弱性が復活）';
              v_fail := v_fail + 1;
            end if;
            -- 新設4引数版の所有者が既存関数と一致すること。definer 権限が変わると
            -- profiles.pooled_points / eggs.growth_points への UPDATE が落ちる。
            if to_regprocedure('public.fn_apply_growth(uuid,integer,date,text)') is not null
               and to_regprocedure('public.fn_finalize_day(date)') is not null
               and (select proowner from pg_proc where oid = to_regprocedure('public.fn_apply_growth(uuid,integer,date,text)'))
                   is distinct from
                   (select proowner from pg_proc where oid = to_regprocedure('public.fn_finalize_day(date)')) then
              raise warning '[FAIL] 新設 fn_apply_growth の所有者が fn_finalize_day と違う（definer 権限が変わる）';
              v_fail := v_fail + 1;
            end if;

            -- 提出経路の入口は生きていること（塞ぎすぎの検出）。
            if to_regprocedure('public.fn_submit_and_finalize_day(date,integer,jsonb,text)') is null
               or not has_function_privilege('authenticated','public.fn_submit_and_finalize_day(date,integer,jsonb,text)','execute') then
              raise warning '[FAIL] authenticated が fn_submit_and_finalize_day を実行できない（提出経路が死ぬ）';
              v_fail := v_fail + 1;
            end if;
            if to_regprocedure('public.fn_claim_warmup(integer)') is null
               or not has_function_privilege('authenticated','public.fn_claim_warmup(integer)','execute') then
              raise warning '[FAIL] authenticated が fn_claim_warmup を実行できない（初回ボーナスが死ぬ）';
              v_fail := v_fail + 1;
            end if;

            if v_fail > 0 then
              raise exception 'v1.1 DB適用の検証 失敗（% 件）', v_fail;
            end if;
            raise notice '=== v1.1 DB適用の検証 PASS（0013/0014/0015/0016）===';
          end $$;
          SQL
