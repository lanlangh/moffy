name: DB Apply v1.1 (0013 to 0016)

# v1.1 の DB 変更 4本をライブ DB(moffy-prod)へ**1トランザクションで**適用する。
#
#   0013 … app_under のキー欠落を未達に倒す / daily_tiktok_under_20 を停止・掃除
#   0014 … fn_profile_stats（メニュー統計のサーバー集計 RPC）
#   0015 … クエスト達成条件の fail-closed 化（reduce_total / streak_keep /
#           hatch_count / app_under）+ eggs.hatched_at の新設
#   0016 … 成長充当の冪等キーに発生源を含める（消えていた削減ptを卵に届ける）
#
# ⚠️ なぜ1トランザクションか:
#   4本には依存関係がある（0015 は 0013 の quest_condition_met を全文置換し、
#   0016 は 0012 の fn_finalize_day を土台にする）。途中で失敗して中途半端な状態が
#   残ると、どこまで適用されたかを人間が判定するのが難しい。psql に -f を並べて
#   --single-transaction を付けると、1本でも失敗した時点で**全部ロールバック**される。
#
# ⚠️ アプリとの適用順:
#   **DB を先に適用してからアプリを配信する。**
#   4本とも新しい関数シグネチャをクライアントに要求しないため、現在公開中の
#   1.0.2 を壊さない（0016 の fn_apply_growth は引数にデフォルトがあり、
#   既存の3引数呼び出しはそのまま通る）。逆にアプリを先に出すと、fn_profile_stats が
#   無い状態で v1.1 アプリが動くことになる（v1.1 は統計欠落として縮退表示するので
#   軽傷だが、順序を守れば起きない）。
#
# 冪等: 4本とも再実行安全（create or replace / add column if not exists /
#       drop if exists / where 句つきの UPDATE・DELETE）。
# 接続は Secret SUPABASE_DB_URL。前提: 0001〜0012 は適用済み。手動実行のみ。
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secret present
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret が未設定です。"
            exit 1
          fi
          psql --version

      # --- 前提の確認: 0011/0012 が入っていること -------------------------------
      # 0016 は 0012 版の fn_finalize_day を土台にしている。0012 未適用の DB に当てると
      # 「基準値を確定済み日だけに絞る」修正が巻き戻る（＝注入行が基準値に効く状態に戻る）。
      - name: Gate (前提マイグレーションの確認)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if to_regprocedure('public.fn_submit_and_finalize_day(date,integer,jsonb,text)') is null then
              raise exception '適用中止: 0011 が未適用（fn_submit_and_finalize_day が無い）。先に db-apply-0011 を実行すること。';
            end if;
            if (select prosrc from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname='public' and p.proname='fn_finalize_day')
               not like '%and is_finalized = true%' then
              raise exception '適用中止: 0012 が未適用（fn_finalize_day の基準値クエリに is_finalized=true が無い）。';
            end if;
            raise notice '=== 前提ゲート PASS（0011/0012 適用済み）===';
          end $$;
          SQL

      # --- 適用前の可視化: 何が消え、何が farm されていたかを記録に残す -----------
      - name: Inspect before apply (可視化のみ・失敗させない)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "### 停止対象クエストの現状（reward_granted=true があれば不正取得の実績）"
          psql "$DB_URL" -c "select quest_id, is_completed, reward_granted, count(*) from public.user_quests where quest_id='daily_tiktok_under_20' group by 1,2,3 order by 1,2,3;"
          echo "### 0015 の影響見積: per_app が空で確定した日（reduce_total の 50pt が出ていた日）"
          psql "$DB_URL" -c "select count(*) as empty_per_app_finalized_days from public.usage_daily where is_finalized and total_minutes = 0 and coalesce(per_app_minutes,'{}'::jsonb) = '{}'::jsonb;"
          echo "### 0015 の影響見積: 孵化済み卵と、updated_at が直近7日の卵（farm の痕跡になりうる）"
          psql "$DB_URL" -c "select count(*) filter (where location='hatched') as hatched_total, count(*) filter (where location='hatched' and updated_at > now() - interval '7 days') as touched_last_7d from public.eggs;"
          echo "### 0016 の影響見積: 同一日に複数ソースの加算があった回数（= ptが消えた可能性のある日）"
          psql "$DB_URL" -c "select count(*) from (select user_id, ledger_date from public.point_ledger where amount > 0 group by 1,2 having count(distinct source) > 1) t;"

      # 残高は「1ptも動かさない」ことが 0016 の約束。適用の前後で全行を突き合わせる。
      - name: Snapshot balances BEFORE
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DB_URL" -At -F '|' \
            -c "select id, point_balance, pooled_points, gem_balance from public.profiles order by id;" \
            > /tmp/balances_before.txt
          echo "### 適用前の残高（先頭20行）"
          head -20 /tmp/balances_before.txt
          wc -l /tmp/balances_before.txt

      # --- 本体: 4本を1トランザクションで適用 ------------------------------------
      - name: Apply 0013 to 0016 (single transaction)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 --single-transaction \
            -f supabase/migrations/0013_disable_tiktok_quest_fail_closed.sql \
            -f supabase/migrations/0014_profile_stats_rpc.sql \
            -f supabase/migrations/0015_quest_condition_hardening.sql \
            -f supabase/migrations/0016_ledger_source_key.sql

      # --- 残高が動いていないことの証跡 ------------------------------------------
      - name: Verify balances UNCHANGED
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DB_URL" -At -F '|' \
            -c "select id, point_balance, pooled_points, gem_balance from public.profiles order by id;" \
            > /tmp/balances_after.txt
          if diff -u /tmp/balances_before.txt /tmp/balances_after.txt; then
            echo "=== 残高は1ptも動いていない（0016 の約束どおり）==="
          else
            echo "::error::残高が変化した。0016 は既存データを書き換えない設計なので、これは異常。上の diff を確認すること。"
            exit 1
          fi

      # ⚠️ 必ず「失敗したら落ちる」形にすること。
      #   単なる select は値を表示するだけで、false でも 0 行でも exit 0 になり、
      #   関数や権限が誤っていてもワークフローが緑になる（0011 の教訓）。
      - name: Verify (関数・列・権限・データの検査)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_fail    int := 0;
            v_granted int;
            v_src     text;
          begin
            -- ============ 0013: クエスト停止 ============
            if exists (select 1 from public.quest_definitions
                        where id = 'daily_tiktok_under_20' and is_active = true) then
              raise warning '[FAIL] daily_tiktok_under_20 が is_active=true のまま';
              v_fail := v_fail + 1;
            end if;
            if not exists (select 1 from public.quest_definitions
                            where id = 'daily_tiktok_under_20') then
              raise warning '[FAIL] daily_tiktok_under_20 の定義行が消えている（停止のはずが削除された）';
              v_fail := v_fail + 1;
            end if;
            if exists (select 1 from public.user_quests
                        where quest_id = 'daily_tiktok_under_20' and reward_granted = false) then
              raise warning '[FAIL] daily_tiktok_under_20 の未受取インスタンスが残っている';
              v_fail := v_fail + 1;
            end if;
            select count(*) into v_granted
              from public.user_quests
             where quest_id = 'daily_tiktok_under_20' and reward_granted = true;
            if v_granted > 0 then
              raise warning '[WARN] daily_tiktok_under_20 で reward_granted=true が % 件ある。付与済み30pt/件の扱い（回収するか）は人間が判断すること。', v_granted;
            end if;

            -- ============ 0014: 統計RPC ============
            if to_regprocedure('public.fn_profile_stats()') is null then
              raise warning '[FAIL] fn_profile_stats が存在しない';
              v_fail := v_fail + 1;
            else
              if not has_function_privilege('authenticated','public.fn_profile_stats()','execute') then
                raise warning '[FAIL] authenticated が fn_profile_stats を実行できない（メニュー統計が死ぬ）';
                v_fail := v_fail + 1;
              end if;
              if has_function_privilege('anon','public.fn_profile_stats()','execute') then
                raise warning '[FAIL] anon が fn_profile_stats を実行できる（未認証に開いている）';
                v_fail := v_fail + 1;
              end if;
              if (select prosrc from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                   where n.nspname='public' and p.proname='fn_profile_stats')
                 not like '%is_finalized = true%' then
                raise warning '[FAIL] fn_profile_stats が確定日(is_finalized=true)に限定していない';
                v_fail := v_fail + 1;
              end if;
              -- fn_profile_stats は security invoker。参照テーブルの SELECT 権限と
              -- select-own ポリシーが無いと、権限エラーではなく「全部0」を返して
              -- 静かに嘘をつく。関数の存在確認だけでは緑になるのでここまで見る。
              if not (has_table_privilege('authenticated','public.baselines','select')
                  and has_table_privilege('authenticated','public.usage_daily','select')
                  and has_table_privilege('authenticated','public.point_ledger','select')
                  and has_table_privilege('authenticated','public.mofi_collection','select')
                  and has_table_privilege('authenticated','public.streaks','select')) then
                raise warning '[FAIL] authenticated が fn_profile_stats の参照テーブルを select できない';
                v_fail := v_fail + 1;
              end if;
              if (select count(distinct tablename) from pg_policies
                   where schemaname='public' and cmd in ('SELECT','ALL')
                     and tablename in ('baselines','usage_daily','point_ledger','mofi_collection','streaks')) < 5 then
                raise warning '[FAIL] 参照5テーブルの select ポリシーが揃っていない（invoker では0件になる）';
                v_fail := v_fail + 1;
              end if;
            end if;

            -- ============ 0015: 条件の fail-closed 化 ============
            select prosrc into v_src
              from pg_proc p join pg_namespace n on n.oid = p.pronamespace
             where n.nspname = 'public' and p.proname = 'quest_condition_met';
            if v_src is null then
              raise warning '[FAIL] quest_condition_met が存在しない';
              v_fail := v_fail + 1;
            else
              if v_src not like '%jsonb_typeof%' then
                raise warning '[FAIL] app_under が型チェック(jsonb_typeof)をしていない（null値で貫通する）';
                v_fail := v_fail + 1;
              end if;
              if v_src not like '%current_streak%' then
                raise warning '[FAIL] streak_keep が current_streak を見ていない（切った日でも達成になる）';
                v_fail := v_fail + 1;
              end if;
              if v_src not like '%hatched_at%' then
                raise warning '[FAIL] hatch_count が hatched_at を見ていない（no-op UPDATE で farm できる）';
                v_fail := v_fail + 1;
              end if;
              if v_src like '%updated_at at time zone%' then
                raise warning '[FAIL] hatch_count に updated_at 基準の判定が残っている';
                v_fail := v_fail + 1;
              end if;
            end if;
            if has_function_privilege('authenticated',
                 'public.quest_condition_met(uuid, jsonb, public.quest_kind, date)','execute') then
              raise warning '[FAIL] authenticated が quest_condition_met を直接実行できる';
              v_fail := v_fail + 1;
            end if;

            -- eggs.hatched_at: 存在し、かつ authenticated が**書けない**こと。
            if not exists (select 1 from information_schema.columns
                            where table_schema='public' and table_name='eggs'
                              and column_name='hatched_at') then
              raise warning '[FAIL] eggs.hatched_at 列が無い';
              v_fail := v_fail + 1;
            elsif has_column_privilege('authenticated','public.eggs'::regclass,'hatched_at','UPDATE') then
              raise warning '[FAIL] authenticated が eggs.hatched_at を更新できる（孵化日時を偽装できる＝farm 復活）';
              v_fail := v_fail + 1;
            end if;
            if not exists (select 1 from pg_trigger
                            where tgname = 'trg_eggs_stamp_hatched_at' and not tgisinternal) then
              raise warning '[FAIL] trg_eggs_stamp_hatched_at トリガーが無い（今後の孵化が記録されない）';
              v_fail := v_fail + 1;
            end if;
            -- バックフィル漏れ（過去の孵化が全部 hatch_count から消えると別の嘘になる）。
            if exists (select 1 from public.eggs
                        where location = 'hatched' and hatched_at is null) then
              raise warning '[FAIL] 孵化済みなのに hatched_at が null の卵が残っている（バックフィル漏れ）';
              v_fail := v_fail + 1;
            end if;

            -- ============ 0016: 台帳キーの細粒度化 ============
            if to_regprocedure('public.fn_apply_growth(uuid,integer,date,text)') is null then
              raise warning '[FAIL] 4引数版 fn_apply_growth が存在しない';
              v_fail := v_fail + 1;
            end if;
            if to_regprocedure('public.fn_apply_growth(uuid,integer,date)') is not null then
              raise warning '[FAIL] 旧3引数版 fn_apply_growth が残っている（解決が紛らわしい）';
              v_fail := v_fail + 1;
            end if;
            if has_function_privilege('authenticated','public.fn_apply_growth(uuid,integer,date,text)','execute') then
              raise warning '[FAIL] authenticated が fn_apply_growth を直接実行できる（成長度を任意に加算できる）';
              v_fail := v_fail + 1;
            end if;
            -- 呼び出し側が発生源キーを渡していること。
            if (select prosrc from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname='public' and p.proname='fn_finalize_day')
               not like '%fn_apply_growth(null, v_final_points, p_date, v_idem)%' then
              raise warning '[FAIL] fn_finalize_day が発生源キーを渡していない（削減ptが消える問題が残る）';
              v_fail := v_fail + 1;
            end if;
            if (select prosrc from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname='public' and p.proname='fn_claim_warmup')
               not like '%fn_apply_growth(v_egg_id, v_grant, v_today, v_idem)%' then
              raise warning '[FAIL] fn_claim_warmup が発生源キーを渡していない';
              v_fail := v_fail + 1;
            end if;
            -- 0012 の剥奪が巻き戻っていないこと（0002 が grant しているので要再掲）。
            if has_function_privilege('authenticated','public.fn_finalize_day(date)','execute') then
              raise warning '[FAIL] authenticated が本体 fn_finalize_day を直接実行できる（日付境界ガードの迂回が復活）';
              v_fail := v_fail + 1;
            end if;
            -- 提出経路の入口は生きていること（塞ぎすぎの検出）。
            if not has_function_privilege('authenticated','public.fn_submit_and_finalize_day(date,integer,jsonb,text)','execute') then
              raise warning '[FAIL] authenticated が fn_submit_and_finalize_day を実行できない（提出経路が死ぬ）';
              v_fail := v_fail + 1;
            end if;
            if not has_function_privilege('authenticated','public.fn_claim_warmup(integer)','execute') then
              raise warning '[FAIL] authenticated が fn_claim_warmup を実行できない（初回ボーナスが死ぬ）';
              v_fail := v_fail + 1;
            end if;

            if v_fail > 0 then
              raise exception 'v1.1 DB適用の検証 失敗（% 件）', v_fail;
            end if;
            raise notice '=== v1.1 DB適用の検証 PASS（0013/0014/0015/0016）===';
          end $$;
          SQL
