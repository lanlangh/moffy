name: DB Check Health

# サーバー（Supabase）の健康状態を **読むだけ** で確認する。
#
# なぜ要るか（2026-09-14）:
#   1.2.1 を Play に送った直後、Sentry に PostgrestException 504 Gateway Timeout が届いた
#   （profile_repository.dart の fn_profile_stats）。この RPC は本人の行だけを集計する軽い
#   問い合わせで、新規アカウントなら中身は空＝SQL の重さでは説明がつかない。
#   Moffy の Supabase は無料プラン（計算資源・接続数が小さい）なので、基盤側の詰まりを疑う。
#   iOS の審査中にサーバーが不調だとリジェクト（2.1 性能）の原因になるため、提出前に実測する。
#
# ⚠️ `DB Verify` は**マイグレーションを適用する**ワークフローなので本番に流さないこと。
#    こちらは SELECT のみ。書き込み・DDL・設定変更は一切行わない。
#
# 個人情報の扱い: user_id は先頭8文字だけを表示する。メールアドレス等は出さない。

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret present
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret が未設定です。"
            exit 1
          fi

      - name: Install psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql --version

      - name: Read health (SELECT only)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -e
          q() { psql "$DB_URL" -v ON_ERROR_STOP=1 "$@"; }

          echo "=== 1. 応答速度（select 1 を5回）==="
          for i in 1 2 3 4 5; do
            s=$(date +%s%N)
            q -At -c "select 1" >/dev/null
            e=$(date +%s%N)
            echo "  ${i}回目: $(( (e - s) / 1000000 )) ms"
          done

          echo ""
          echo "=== 2. 接続数（いま / 上限）==="
          q -c "select count(*) as 現在の接続数,
                       (select setting::int from pg_settings where name='max_connections') as 上限
                  from pg_stat_activity;"

          echo ""
          echo "=== 3. 状態ごとの接続 ==="
          q -c "select coalesce(state,'(なし)') as state, count(*)
                  from pg_stat_activity group by state order by count(*) desc;"

          echo ""
          echo "=== 4. 5秒以上かかっている問い合わせ（いま実行中）==="
          q -c "select pid, now() - query_start as 経過, state, left(query, 80) as 問い合わせ
                  from pg_stat_activity
                 where state <> 'idle' and query_start < now() - interval '5 seconds'
                   and pid <> pg_backend_pid()
                 order by query_start limit 10;"

          echo ""
          echo "=== 5. 今日(JST)作られたアカウント（auth.users）と profiles の有無 ==="
          q -c "select left(u.id::text, 8) as user_prefix,
                       to_char(u.created_at at time zone 'Asia/Tokyo', 'MM-DD HH24:MI:SS') as 作成JST,
                       u.is_anonymous as 匿名,
                       (p.id is not null) as profileあり
                  from auth.users u
                  left join public.profiles p on p.id = u.id
                 where u.created_at >= date_trunc('day', now() at time zone 'Asia/Tokyo') at time zone 'Asia/Tokyo'
                 order by u.created_at;"

          echo ""
          echo "=== 6. profiles が無いアカウント（全期間）＝作成途中で失敗した可能性 ==="
          q -At -c "select count(*) || ' 件'
                      from auth.users u
                      left join public.profiles p on p.id = u.id
                     where p.id is null;"

          echo ""
          echo "=== 7. DB の大きさ ==="
          q -At -c "select pg_size_pretty(pg_database_size(current_database()));"

          echo ""
          echo "=== 7b. コアループの実績（PostHog の計測漏れを DB で裏取り）==="
          echo "（Android は設定画面を開いて即「未許可」を返すので、許可しても"
          echo "  usage_permission_granted が飛ばない。実際に計測できているかは"
          echo "  usage_daily に **0分より大きい行** があるかで判断する）"
          q -c "select
                  (select count(distinct user_id) from public.usage_daily) as 利用データを出した人,
                  (select count(distinct user_id) from public.usage_daily
                    where total_minutes > 0) as ゼロ分でない人,
                  (select count(distinct user_id) from public.usage_daily
                    where is_finalized) as 確定まで行った人,
                  (select count(*) from public.profiles) as 全ユーザー;"

          echo ""
          echo "=== 7c. 卵の育ち具合（500pt で孵化）==="
          q -c "select location, count(*) as 個数,
                       min(growth_points) as 最小pt, max(growth_points) as 最大pt,
                       count(*) filter (where growth_points >= 500) as 孵化可能
                  from public.eggs group by location order by count(*) desc;"

          echo ""
          echo "=== 7c-2. たまごは本当に育っているか（100=ヒビ1 / 250=ヒビ2 / 500=孵化）==="
          q -c "select
                  count(*) filter (where growth_points = 0)              as pt0,
                  count(*) filter (where growth_points between 1 and 99) as pt1_99,
                  count(*) filter (where growth_points between 100 and 249) as ヒビ1,
                  count(*) filter (where growth_points between 250 and 499) as ヒビ2,
                  count(*) filter (where growth_points >= 500)           as 孵化可能,
                  count(*) as 合計
                  from public.eggs where location = 'incubating';"

          echo ""
          echo "=== 7c-3. アクティブな卵（加点対象）の人ごとの育ち具合 ==="
          q -c "select left(user_id::text, 8) as user_prefix, growth_points as pt,
                       to_char(created_at at time zone 'Asia/Tokyo', 'MM-DD') as 入手,
                       to_char(updated_at at time zone 'Asia/Tokyo', 'MM-DD HH24:MI') as 最終更新
                  from public.eggs
                 where is_active
                 order by growth_points desc
                 limit 15;"

          echo ""
          echo "=== 7c-4. 直近7日で成長pt が動いた卵 ==="
          q -At -c "select count(*) || ' 個 / ' ||
                           count(distinct user_id) || ' 人'
                      from public.eggs
                     where growth_points > 0
                       and updated_at >= now() - interval '7 days';"

          echo ""
          echo "=== 7c-5. 人ごと: 計測 → ポイント → 卵 がつながっているか ==="
          echo "（確定日数があるのに卵ptが増えていない人がいれば、配線の不具合）"
          q -c "select left(u.user_id::text, 8) as user_prefix,
                       u.days as 確定日数, u.minutes as 計測分合計,
                       coalesce(l.earned, 0) as 獲得pt, coalesce(l.spent, 0) as 卵へ充当,
                       e.growth_points as 卵pt,
                       to_char(e.updated_at at time zone 'Asia/Tokyo', 'MM-DD HH24:MI') as 卵の最終更新
                  from (select user_id, count(*) as days, sum(total_minutes) as minutes
                          from public.usage_daily where is_finalized group by user_id) u
                  left join (select user_id,
                                    sum(amount) filter (where amount > 0) as earned,
                                    -sum(amount) filter (where amount < 0) as spent
                               from public.point_ledger group by user_id) l
                    on l.user_id = u.user_id
                  left join public.eggs e on e.user_id = u.user_id and e.is_active
                 order by u.days desc limit 15;"

          echo ""
          echo "=== 7c-5b. 直近に卵が動いた人の、日ごとの中身（最大14日）==="
          echo "（計測分が 0 や極小なら、端末が利用時間を取れていない）"
          q -c "with target as (
                  select user_id from public.eggs where is_active
                   order by updated_at desc limit 1)
                select u.usage_date as 日付, u.total_minutes as 計測分,
                       u.is_finalized as 確定,
                       b.applied_minutes as 基準分,
                       coalesce(sum(l.amount) filter (where l.amount > 0), 0) as その日のpt
                  from public.usage_daily u
                  join target t on t.user_id = u.user_id
                  left join public.baselines b
                    on b.user_id = u.user_id and b.baseline_date = u.usage_date
                  left join public.point_ledger l
                    on l.user_id = u.user_id and l.ledger_date = u.usage_date
                 group by u.usage_date, u.total_minutes, u.is_finalized, b.applied_minutes
                 order by u.usage_date desc limit 14;"

          echo ""
          echo "=== 7c-6. ポイントの出どころ別（全期間）==="
          q -c "select source, count(*) as 行数, sum(amount) as 合計pt,
                       count(distinct user_id) as 人数,
                       max(ledger_date) as 最新日
                  from public.point_ledger group by source order by count(*) desc;"

          echo ""
          echo "=== 7d. 孵化してMofiを手に入れた人 ==="
          q -c "select count(distinct user_id) as 人数, count(*) as 行数,
                       coalesce(sum(obtained_count),0) as 累計体数
                  from public.mofi_collection;"

          echo ""
          echo "=== 8. 504 が出た問い合わせに索引があるか ==="
          echo "（entitlements は user_id で1行引き / usage_daily は user_id+日付）"
          q -c "select tablename as テーブル, indexname as 索引, indexdef as 定義
                  from pg_indexes
                 where schemaname='public'
                   and tablename in ('entitlements','usage_daily','profiles')
                 order by tablename, indexname;"

          echo ""
          echo "=== 9. キャッシュ命中率（低いとディスク待ちで遅くなる）==="
          q -c "select round(100.0 * sum(blks_hit) / nullif(sum(blks_hit)+sum(blks_read),0), 2) as 命中率_pct,
                       sum(blks_read) as ディスク読み, sum(blks_hit) as メモリ読み,
                       sum(xact_commit) as 成功Tx, sum(xact_rollback) as 失敗Tx,
                       sum(deadlocks) as デッドロック
                  from pg_stat_database where datname = current_database();"

          echo ""
          echo "=== 10. 行数（重い全走査が起きうるほど育っていないか）==="
          q -c "select relname as テーブル, n_live_tup as 行数, seq_scan as 全走査回数,
                       idx_scan as 索引走査回数
                  from pg_stat_user_tables
                 where schemaname='public' and n_live_tup > 0
                 order by n_live_tup desc limit 12;"
