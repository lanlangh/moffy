name: DB Apply 0013+0014 (v1.1 order0 quest fail-closed / order1 profile stats)

# 0013 と 0014 をライブ DB(moffy-prod)に適用する (v1.1 順0+順1 / ORG_STATE「直す順番」)。
# [0013 = 順0]
#   * quest_condition_met … app_under の per_app_minutes キー欠落を未達に倒す
#     (iOS はキーが構造的に無く 0<20 で不正達成できた = 30pt/日)
#   * quest_definitions.daily_tiktok_under_20 … is_active=false (新規インスタンス停止)
#   * user_quests … 同クエストの未受取インスタンスを削除 (画面の残骸防止)
# [0014 = 順1 / S1]
#   * fn_profile_stats … メニュー統計5指標のサーバー集計 RPC (Mock直書き値の置換先)
# UPDATE/DELETE は再実行安全 / 関数は create or replace ＝ 冪等なので再実行可。
# 接続は Secret SUPABASE_DB_URL。前提: 0001〜0012 は適用済み(本番)。手動実行のみ。
#
# ⚠️ 適用順:
#   * 0013 は v1.1 順2 (クエスト自動評価の配線) より**必ず先に**適用すること。
#   * 0014 は S1 クライアント修正 (SupabaseProfileRepository) を含むアプリ更新の
#     **前に** DB へ適用すること (先にアプリを出すと fn_profile_stats が「関数が無い」
#     で失敗する)。DB を先に適用してもアプリ未更新の実害は無い (0011 と同じ原則)。
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secret present
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret が未設定です。"
            exit 1
          fi
          psql --version

      # 適用前の点検: 対象クエストの現状を可視化する (何件消えるかを記録に残す)。
      #   reward_granted=true が既にあれば「不正取得が発生済み」の証拠なので目視確認する。
      - name: Inspect daily_tiktok_under_20 before apply (可視化のみ・失敗させない)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "### quest_definitions の現状"
          psql "$DB_URL" -c "select id, kind, is_active from public.quest_definitions order by id;"
          echo "### 削除対象 (reward_granted=false) と保全対象 (true) の内訳"
          psql "$DB_URL" -c "select is_completed, reward_granted, count(*), min(period_start), max(period_start) from public.user_quests where quest_id='daily_tiktok_under_20' group by 1,2 order by 1,2;"
          echo "### 参考: per_app_minutes に TikTok キーを持つ確定日の件数 (0 なら誰も正規達成し得なかった)"
          psql "$DB_URL" -c "select count(*) from public.usage_daily where is_finalized and per_app_minutes ? 'com.zhiliaoapp.musically';"

      - name: Apply 0013 (tiktokクエスト停止 + fail-closed)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/0013_disable_tiktok_quest_fail_closed.sql

      - name: Apply 0014 (メニュー統計の集計RPC / 0013 の後に適用)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/0014_profile_stats_rpc.sql

      # ⚠️ 必ず「失敗したら落ちる」形 (0011 の教訓: 単なる select は緑になる)。
      - name: Verify (定義の停止 / 関数のfail-closed / 残骸ゼロ)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_fail    int := 0;
            v_granted int;
            v_src     text;
          begin
            -- --- 定義が停止されていること ---
            if exists (select 1 from public.quest_definitions
                        where id = 'daily_tiktok_under_20' and is_active = true) then
              raise warning '[FAIL] daily_tiktok_under_20 が is_active=true のまま';
              v_fail := v_fail + 1;
            end if;
            if not exists (select 1 from public.quest_definitions
                            where id = 'daily_tiktok_under_20') then
              raise warning '[FAIL] daily_tiktok_under_20 の定義行が消えている (停止のはずが削除された)';
              v_fail := v_fail + 1;
            end if;

            -- --- 関数ソースにキー欠落 fail-closed が入っていること ---
            select prosrc into v_src
              from pg_proc p join pg_namespace n on n.oid = p.pronamespace
             where n.nspname = 'public' and p.proname = 'quest_condition_met';
            if v_src is null then
              raise warning '[FAIL] quest_condition_met が存在しない';
              v_fail := v_fail + 1;
            elsif v_src not like '%v_has_key%' then
              raise warning '[FAIL] quest_condition_met にキー欠落 fail-closed (v_has_key) が無い (0013 未反映)';
              v_fail := v_fail + 1;
            end if;

            -- --- 権限: quest_condition_met は内部専用のまま ---
            if has_function_privilege('authenticated',
                 'public.quest_condition_met(uuid, jsonb, public.quest_kind, date)', 'execute') then
              raise warning '[FAIL] authenticated が quest_condition_met を直接実行できる';
              v_fail := v_fail + 1;
            end if;

            -- --- 未受取インスタンスが残っていないこと ---
            if exists (select 1 from public.user_quests
                        where quest_id = 'daily_tiktok_under_20'
                          and reward_granted = false) then
              raise warning '[FAIL] daily_tiktok_under_20 の未受取インスタンスが残っている';
              v_fail := v_fail + 1;
            end if;

            -- --- 付与済み (=不正取得の可能性) は失敗にはしないが必ず警告する ---
            select count(*) into v_granted
              from public.user_quests
             where quest_id = 'daily_tiktok_under_20' and reward_granted = true;
            if v_granted > 0 then
              raise warning '[WARN] daily_tiktok_under_20 で reward_granted=true が % 件ある。付与済み 30pt/件 の扱い (回収するか) は人間が判断すること。', v_granted;
            end if;

            -- ============ 0014 (fn_profile_stats) ============
            if to_regprocedure('public.fn_profile_stats()') is null then
              raise warning '[FAIL] fn_profile_stats が存在しない (0014 未適用)';
              v_fail := v_fail + 1;
            else
              if not has_function_privilege('authenticated', 'public.fn_profile_stats()', 'execute') then
                raise warning '[FAIL] authenticated が fn_profile_stats を実行できない (メニュー統計が死ぬ)';
                v_fail := v_fail + 1;
              end if;
              if has_function_privilege('anon', 'public.fn_profile_stats()', 'execute') then
                raise warning '[FAIL] anon が fn_profile_stats を実行できる (未認証に開いている)';
                v_fail := v_fail + 1;
              end if;
              -- 集計定義の要点がソースに残っていること (is_finalized 限定 / 正の記帳のみ)。
              if (select prosrc from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                   where n.nspname = 'public' and p.proname = 'fn_profile_stats')
                 not like '%is_finalized = true%' then
                raise warning '[FAIL] fn_profile_stats が確定日 (is_finalized=true) に限定していない';
                v_fail := v_fail + 1;
              end if;
            end if;

            if v_fail > 0 then
              raise exception '0013+0014 適用検証 失敗（% 件）', v_fail;
            end if;
            raise notice '=== 0013+0014 適用検証 PASS ===';
          end $$;
          SQL
