name: ASC Rename Version (下書きの番号を書き換える)

# ASC は下書き(PREPARE_FOR_SUBMISSION)を同時に1つしか持てないため、
# 「新しい番号で出したい」ときに新規作成できない場面がある。
# 既にある下書きの versionString を書き換えて再利用するためのワークフロー。
#
# 安全装置（tools/asc/asc_rename_version.mjs 側で担保）:
#   * 対象は PREPARE_FOR_SUBMISSION の下書きのみ。公開中/審査中は拒否。
#   * 変更先の番号が既に存在するなら中止（重複を作らない）。
#   * 使う HTTP メソッドは GET と PATCH のみ。POST/DELETE を実装していないので、
#     新規作成も削除もこのツールでは物理的に起こり得ない。
#   * 変更後に読み直して確認してから成功終了。
#   * 既定は dry-run。実際に変更するには mode=apply を明示する。
on:
  workflow_dispatch:
    inputs:
      from_version:
        description: "変更元のバージョン（下書き / 例: 1.0.3）"
        required: true
        type: string
      to_version:
        description: "変更後のバージョン（例: 1.1.0）"
        required: true
        type: string
      mode:
        description: "dry-run（既定・変更しない） / apply（実際に変更する）"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - apply

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 既存の asc-* ワークフローと同じ方式（base64 で保管された .p8 をデコードする）。
      - name: Decode ASC API key (.p8)
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_P8_BASE64" ]; then echo "::error::ASC_KEY_P8_BASE64 未設定"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc/key.p8"

      - name: Rename
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          node tools/asc/asc_rename_version.mjs \
            "$RUNNER_TEMP/asc/key.p8" "$ASC_KEY_ID" "$ASC_ISSUER_ID" \
            com.moffy.app "${{ inputs.from_version }}" "${{ inputs.to_version }}" \
            "${{ inputs.mode == 'apply' && 'apply' || 'dry-run' }}"

      - name: Clean up key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc/key.p8"
