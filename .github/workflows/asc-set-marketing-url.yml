name: ASC Set Marketing URL (デベロッパWebサイトだけを設定)

# AdMob の app-ads.txt クローラは「ストア掲載ページのデベロッパーサイト」を見に行く。
# iOS は未設定のため、設定しないと iOS の app-ads.txt は永久に確認されない。
# 触るのは appStoreVersionLocalizations の marketingUrl 1フィールドのみ。
on:
  workflow_dispatch:
    inputs:
      url:
        description: "設定するURL"
        required: true
        default: "https://lan-corp.com"
        type: string
      mode:
        description: "dry-run(読むだけ) / apply(書き込む)"
        required: true
        default: "dry-run"
        type: choice
        options: [dry-run, apply]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode ASC API key (.p8)
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc/key.p8"
      - name: Set marketing URL
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node tools/asc/asc_set_marketing_url.mjs "$RUNNER_TEMP/asc/key.p8" "$ASC_KEY_ID" "$ASC_ISSUER_ID" com.moffy.app "${{ inputs.url }}" "${{ inputs.mode }}"
      - name: Clean up key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc/key.p8"
